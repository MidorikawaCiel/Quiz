<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>118元素データベース</title>
    <style>
        body { font-family: sans-serif; padding: 20px; color: #333; }
        h2 { margin-bottom: 20px; }
        
        #searchInput {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .table-container {
            overflow-x: auto;
            max-height: 85vh; 
            border: 1px solid #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background-color: #eee;
            position: sticky;
            top: 0;
            z-index: 10;
            cursor: pointer;
            user-select: none;
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th::after { 
            content: " ↕"; 
            color: #888; 
            font-size: 0.8em; 
        }

        td {
            border: 1px solid #ccc;
            padding: 8px 10px;
            text-align: left;
            background-color: #fff;
        }

        /* 3列の幅調整 */
        .col-element { width: 25%; }
        .col-symbol { width: 25%; }
        .col-desc { width: 50%; }

        tr { background-color: #fff; }
    </style>
</head>
<body>

    ];

    const tbody = document.getElementById("tableBody");

    function renderTable() {
        tbody.innerHTML = "";
        elementData.forEach(e => {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${e[0]}</td><td>${e[1]}</td><td>${e[2]}</td>`;
            tbody.appendChild(tr);
        });
    }
    renderTable();

    function hiraToKana(str) {
        return str.replace(/[\u3041-\u3096]/g, m => String.fromCharCode(m.charCodeAt(0) + 0x60));
    }

    function filterTable() {
        const input = document.getElementById("searchInput");
        const filter = hiraToKana(input.value.trim().toUpperCase());
        const tr = tbody.getElementsByTagName("tr");

        for (let i = 0; i < tr.length; i++) {
            let found = false;
            const tds = tr[i].getElementsByTagName("td");
            if (filter === "") {
                tr[i].style.display = "";
                continue;
            }
            // 0:元素名, 1:元素記号（シンボル） の両方を部分一致で検索
            for (let j = 0; j <= 1; j++) {
                const text = hiraToKana(tds[j].textContent.toUpperCase());
                if (text.indexOf(filter) > -1) { found = true; break; }
            }
            tr[i].style.display = found ? "" : "none";
        }
    }

    function sortTable(n) {
        const table = document.getElementById("myTable");
        let switching = true;
        let dir = "asc"; 
        let switchcount = 0;
        while (switching) {
            switching = false;
            const rows = tbody.rows;
            for (var i = 0; i < (rows.length - 1); i++) {
                var shouldSwitch = false;
                const x = rows[i].getElementsByTagName("td")[n];
                const y = rows[i + 1].getElementsByTagName("td")[n];
                const xVal = x.textContent.toLowerCase();
                const yVal = y.textContent.toLowerCase();
                
                // 数値として比較できるかチェック（原子番号順などの場合、文字列ではなく数値でソートさせるための配慮）
                const xNum = parseFloat(xVal);
                const yNum = parseFloat(yVal);
                
                if (!isNaN(xNum) && !isNaN(yNum)) {
                    if (dir === "asc" ? xNum > yNum : xNum < yNum) { shouldSwitch = true; break; }
                } else {
                    if (dir === "asc" ? xVal > yVal : xVal < yVal) { shouldSwitch = true; break; }
                }
            }
            if (shouldSwitch) {
                rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                switching = true;
                switchcount++;
            } else if (switchcount === 0 && dir === "asc") {
                dir = "desc";
                switching = true;
            }
        }
    }
</script>
